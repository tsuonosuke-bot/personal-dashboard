<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ナレッジDB ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-label { font-size: 12px; color: #64748b; }
  .stat-value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .full { grid-column: 1 / -1; }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .chart-box { position: relative; height: 240px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  input[type=text], select {
    border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; font-size: 14px; outline: none;
    font-family: inherit; background: #fff;
  }
  input[type=text] { flex: 1; min-width: 200px; }
  .count { font-size: 12px; color: #64748b; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: #64748b; font-weight: 500; padding: 12px; border-bottom: 1px solid #f1f5f9; }
  td { padding: 12px; border-bottom: 1px solid #f8fafc; vertical-align: top; }
  tr:hover td { background: #f8fafc; }
  .title { font-weight: 500; }
  .expl { font-size: 12px; color: #64748b; margin-top: 2px; max-width: 420px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; font-size: 14px; }
  button { border: 1px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 6px 14px;
           cursor: pointer; font-size: 14px; font-family: inherit; }
  button:hover:not(:disabled) { background: #f1f5f9; }
  button:disabled { opacity: 0.4; cursor: default; }
  .msg { padding: 40px; text-align: center; color: #94a3b8; }
  .err { padding: 24px; color: #dc2626; }
  @media (max-width: 800px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>ナレッジDB ダッシュボード</h1>
    <button id="reload">🔄 更新</button>
  </div>
  <div id="content"><div class="msg">読み込み中...</div></div>
</div>

<script>
const SUPABASE_URL = "https://plwlxwidpqbunugfxjhp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsd2x4d2lkcHFidW51Z2Z4amhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDkxMTQsImV4cCI6MjEwNDQyNTExNH0.o6Dka8TNxjcH0JLAw6OdvtqJsDHqDRZuE2Q3feH2t3Y";
const HEADERS = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };

const MASTERY_COLORS = { "未定着": "#f87171", "復習中": "#fbbf24", "定着": "#4ade80" };
const PIE_COLORS = ["#60a5fa","#f472b6","#facc15","#4ade80","#a78bfa","#fb923c","#2dd4bf","#f87171","#94a3b8","#c084fc"];

let knowledge = [], quizLog = [];
let state = { search: "", category: "すべて", mastery: "すべて", page: 1 };
const PAGE_SIZE = 15;
let charts = [];

async function fetchTable(table, params) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?" + params, { headers: HEADERS });
  if (!res.ok) throw new Error(table + ": " + res.status + " " + (await res.text()));
  return res.json();
}

async function loadData() {
  document.getElementById("content").innerHTML = '<div class="msg">読み込み中...</div>';
  try {
    const [k, q] = await Promise.all([
      fetchTable("knowledge", "select=*&archived=eq.false&order=created_at.desc&limit=2000"),
      fetchTable("quiz_log", "select=*&order=asked_on.asc&limit=5000"),
    ]);
    knowledge = k; quizLog = q;
    state.page = 1;
    renderAll();
  } catch (e) {
    document.getElementById("content").innerHTML =
      '<div class="err">エラー: ' + e.message + '</div>';
  }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function getFiltered() {
  const s = state.search.toLowerCase();
  return knowledge.filter(k => {
    if (state.category !== "すべて" && k.category !== state.category) return false;
    if (state.mastery !== "すべて" && k.mastery !== state.mastery) return false;
    if (s) {
      const hay = ((k.title||"") + " " + (k.explanation||"") + " " + (k.tags||[]).join(" ")).toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
}

function renderAll() {
  const today = new Date().toISOString().slice(0,10);
  const stats = {
    total: knowledge.length,
    mastered: knowledge.filter(k => k.mastery === "定着").length,
    due: knowledge.filter(k => k.next_review_on && k.next_review_on <= today).length,
    quizzes: quizLog.length,
  };
  const categories = ["すべて"].concat([...new Set(knowledge.map(k => k.category))].sort());

  document.getElementById("content").innerHTML = `
    <div class="stats">
      ${[["総カード数",stats.total],["定着済み",stats.mastered],["本日復習予定",stats.due],["累計出題数",stats.quizzes]]
        .map(([l,v]) => `<div class="card"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join("")}
    </div>
    <div class="charts">
      <div class="card"><div class="chart-title">カテゴリ別分布</div><div class="chart-box"><canvas id="c-cat"></canvas></div></div>
      <div class="card"><div class="chart-title">習熟度分布</div><div class="chart-box"><canvas id="c-mas"></canvas></div></div>
      <div class="card full"><div class="chart-title">学習履歴（日別出題数・正答率）</div><div class="chart-box"><canvas id="c-hist"></canvas></div></div>
    </div>
    <div class="card filters">
      <input type="text" id="f-search" placeholder="🔍 タイトル・説明・タグで検索" value="${esc(state.search)}">
      <select id="f-cat">${categories.map(c => `<option${c===state.category?" selected":""}>${esc(c)}</option>`).join("")}</select>
      <select id="f-mas">${["すべて","未定着","復習中","定着"].map(m => `<option${m===state.mastery?" selected":""}>${m}</option>`).join("")}</select>
      <span class="count" id="f-count"></span>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>タイトル</th><th>カテゴリ</th><th>習熟度</th><th>正答率</th><th>次回復習</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev">前へ</button><span id="pageinfo"></span><button id="next">次へ</button>
    </div>
  `;

  const si = document.getElementById("f-search");
  si.addEventListener("input", e => { state.search = e.target.value; state.page = 1; renderTable(); });
  document.getElementById("f-cat").addEventListener("change", e => { state.category = e.target.value; state.page = 1; renderTable(); });
  document.getElementById("f-mas").addEventListener("change", e => { state.mastery = e.target.value; state.page = 1; renderTable(); });
  document.getElementById("prev").addEventListener("click", () => { state.page--; renderTable(); });
  document.getElementById("next").addEventListener("click", () => { state.page++; renderTable(); });

  renderCharts();
  renderTable();
}

function renderCharts() {
  charts.forEach(c => c.destroy());
  charts = [];

  const catCounts = {};
  knowledge.forEach(k => { catCounts[k.category] = (catCounts[k.category]||0)+1; });
  const catEntries = Object.entries(catCounts).sort((a,b) => b[1]-a[1]);
  charts.push(new Chart(document.getElementById("c-cat"), {
    type: "doughnut",
    data: {
      labels: catEntries.map(e => e[0]),
      datasets: [{ data: catEntries.map(e => e[1]), backgroundColor: catEntries.map((_,i) => PIE_COLORS[i%PIE_COLORS.length]) }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right", labels: { boxWidth: 12, font: { size: 11 } } } } }
  }));

  const mOrder = ["未定着","復習中","定着"];
  const mCounts = mOrder.map(m => knowledge.filter(k => k.mastery === m).length);
  charts.push(new Chart(document.getElementById("c-mas"), {
    type: "bar",
    data: { labels: mOrder, datasets: [{ data: mCounts, backgroundColor: mOrder.map(m => MASTERY_COLORS[m]) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  }));

  const dayMap = {};
  quizLog.forEach(q => {
    if (!dayMap[q.asked_on]) dayMap[q.asked_on] = { total: 0, correct: 0 };
    dayMap[q.asked_on].total++;
    if (q.verdict === "正解") dayMap[q.asked_on].correct++;
  });
  const days = Object.keys(dayMap).sort();
  charts.push(new Chart(document.getElementById("c-hist"), {
    type: "line",
    data: {
      labels: days,
      datasets: [
        { label: "出題数", data: days.map(d => dayMap[d].total), borderColor: "#60a5fa", backgroundColor: "#60a5fa", yAxisID: "y", tension: 0.3, pointRadius: 2 },
        { label: "正答率(%)", data: days.map(d => Math.round(dayMap[d].correct/dayMap[d].total*100)), borderColor: "#4ade80", backgroundColor: "#4ade80", yAxisID: "y1", tension: 0.3, pointRadius: 2 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: { position: "left", beginAtZero: true, ticks: { precision: 0 } },
        y1: { position: "right", min: 0, max: 100, grid: { drawOnChartArea: false } },
        x: { ticks: { font: { size: 10 }, maxRotation: 45 } }
      }
    }
  }));
}

function renderTable() {
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (state.page > totalPages) state.page = totalPages;
  const rows = filtered.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);

  document.getElementById("f-count").textContent = filtered.length + "件";
  document.getElementById("pageinfo").textContent = state.page + " / " + totalPages;
  document.getElementById("prev").disabled = state.page <= 1;
  document.getElementById("next").disabled = state.page >= totalPages;

  document.getElementById("tbody").innerHTML = rows.length ? rows.map(k => {
    const color = MASTERY_COLORS[k.mastery] || "#94a3b8";
    return `<tr>
      <td><div class="title">${esc(k.title)}</div>${k.explanation ? `<div class="expl">${esc(k.explanation)}</div>` : ""}</td>
      <td>${esc(k.category)}</td>
      <td><span class="badge" style="background:${color}22;color:${color}">${esc(k.mastery)}</span></td>
      <td>${k.accuracy != null ? Math.round(k.accuracy*100) + "%" : "-"}</td>
      <td>${esc(k.next_review_on || "-")}</td>
    </tr>`;
  }).join("") : '<tr><td colspan="5" class="msg">該当データなし</td></tr>';
}

document.getElementById("reload").addEventListener("click", loadData);
loadData();
</script>
</body>
</html>
