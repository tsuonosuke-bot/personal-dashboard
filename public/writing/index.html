<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2ed" />
    <title>Writing — Personal Hub</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/writing.css" />
    <link rel="stylesheet" href="/dashboard-shell.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="dashboard-header">
        <div class="dashboard-header-inner">
          <div class="dashboard-brand">
            <span class="dashboard-brand-mark writing" aria-hidden="true">W</span>
            <span><h1>Writing</h1><small>Pomera writing queue</small></span>
          </div>
          <div class="dashboard-actions">
            <a class="dashboard-hub" href="/">← Hub</a>
            <details class="dashboard-switcher">
              <summary aria-label="ページを切り替える">
                <svg class="dashboard-switcher-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="5" cy="6" r="1" /><circle cx="5" cy="12" r="1" /><circle cx="5" cy="18" r="1" />
                  <path d="M9 6h10M9 12h10M9 18h10" />
                </svg>
                <span>Dashboards</span>
              </summary>
              <nav aria-label="ダッシュボードを切り替え">
                <a href="/compass/">Idea</a><a href="/projects/">Projects</a><span aria-current="page">Writing</span><a href="/habits/">Habits</a><a href="/go/financial">Finance</a><a href="/go/knowledge">Knowledge</a>
              </nav>
            </details>
            <span class="source-badge" id="sourceBadge">接続確認中</span>
            <button class="dashboard-refresh" id="refreshButton" type="button" title="再読み込み" aria-label="データを再読み込み">↻</button>
            <a class="dashboard-primary" href="/compass/?view=wants"><span aria-hidden="true">＋</span><span>テーマを追加</span></a>
          </div>
        </div>
      </header>

      <main class="dashboard-main">
        <section class="summary-grid" aria-label="Writingサマリー">
          <button type="button" data-summary-view="candidate"><span>アイデア</span><strong id="candidateCount">—</strong><small>これから書くテーマ</small></button>
          <button type="button" data-summary-view="completed"><span>完了</span><strong id="completedCount">—</strong><small>書き終えたテーマ</small></button>
        </section>

        <section class="writing-board" aria-labelledby="boardTitle">
          <header class="board-header">
              <div><span class="eyebrow">TOPICS</span><h2 id="boardTitle">アイデア</h2></div>
          </header>
          <div class="tabs" role="tablist" aria-label="表示するWritingテーマ">
            <button class="active" type="button" role="tab" aria-selected="true" data-view="candidate">アイデア <b id="candidateTabCount">—</b></button>
            <button type="button" role="tab" aria-selected="false" data-view="completed">完了 <b id="completedTabCount">—</b></button>
          </div>
          <div class="filters">
            <label><span>検索</span><input id="searchInput" type="search" placeholder="タイトル・論点" /></label>
            <button id="clearFilters" type="button" hidden>解除</button>
          </div>
          <div class="result-line"><span id="resultCount">読み込み中</span><small>本文はPomeraで執筆。ここではアイデアと完了だけを管理します</small></div>
          <div class="state-card" id="loadingState" role="status">Writingテーマを読み込んでいます…</div>
          <div class="state-card error" id="errorState" role="alert" hidden><strong>読み込めませんでした</strong><p id="errorMessage"></p><button id="retryButton" type="button">再試行</button></div>
          <div class="topic-list" id="topicList" hidden></div>
        </section>
      </main>
    </div>

    <div class="modal" id="editorModal" hidden>
      <button class="modal-backdrop" id="editorBackdrop" type="button" aria-label="編集画面を閉じる"></button>
      <section class="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
        <header><div><span class="eyebrow" id="editorKicker">WRITING</span><h2 id="editorTitle">テーマを編集</h2></div><button class="icon-button" id="editorClose" type="button" aria-label="閉じる">×</button></header>
        <form id="editorForm">
          <div class="editor-source"><span>元のWant</span><a id="sourceWantLink" href="/compass/">確認する →</a></div>
          <label><span>タイトル</span><textarea id="titleInput" rows="2" maxlength="240" required></textarea></label>
          <label><span>書きたいこと・論点</span><textarea id="questionInput" rows="5" maxlength="2000"></textarea></label>
          <label><span>状態</span><select id="editorStatus"></select></label>
          <p class="form-error" id="formError" role="alert" hidden></p>
          <div class="editor-actions"><button id="editorCancel" type="button">キャンセル</button><button class="save-button" id="saveButton" type="submit">保存</button></div>
        </form>
      </section>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/writing.js" type="module"></script>
  </body>
</html>
