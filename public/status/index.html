<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2ed" />
    <title>接続状態 — Personal Hub</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/status.css" />
  </head>
  <body>
    <header class="status-header">
      <div>
        <a href="/">← Hub</a>
        <span><strong>接続状態</strong><small>Personal・Knowledge・Finance</small></span>
        <button id="refreshButton" type="button">再確認</button>
      </div>
    </header>
    <main>
      <div class="status-loading" id="loadingState" role="status"><span></span><p>3つの接続先を確認しています</p></div>
      <div class="status-error" id="errorState" role="alert" hidden><strong>接続状態を読み込めませんでした</strong><p id="errorMessage"></p><button id="retryButton" type="button">再試行</button></div>
      <section class="status-grid" id="statusGrid" aria-label="サービス別の接続状態" hidden></section>
    </main>
    <script src="/status/status.js" type="module"></script>
  </body>
</html>
