<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Compass — Inbox & Wants</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Personal Hubへ戻る">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 5 30.5 18 43 24l-12.5 6L24 43l-6.5-13L5 24l12.5-6L24 5Z"/><circle cx="24" cy="24" r="4"/></svg></span>
          <span><b>Compass</b><small>Inbox & Wants</small></span>
        </a>
        <div class="topbar-actions">
          <a class="hub-link" href="/">← Hub</a>
          <details class="dashboard-switcher" id="dashboardSwitcher">
            <summary>Dashboards <span aria-hidden="true">⌄</span></summary>
            <nav id="dashboardNav" aria-label="ダッシュボードを切り替え"><span class="nav-loading">リンクを確認中</span></nav>
          </details>
          <span class="source-badge" id="sourceBadge"><i></i>接続確認中</span>
          <button class="icon-button" id="refreshButton" type="button" title="再読込" aria-label="データを再読込"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.8-4M4 4v4h4M4 13a8 8 0 0 0 14.8 4M20 20v-4h-4"/></svg></button>
        </div>
      </header>

      <main>
        <section class="metrics" aria-label="サマリー">
          <button class="metric metric-inbox" type="button" data-view="inbox" data-filter="pending"><span class="metric-icon">↘</span><span class="metric-label">未整理のInbox</span><strong id="pendingInbox">—</strong><small><span id="inboxTotal">—</span>件のうち</small></button>
          <button class="metric metric-wants" type="button" data-view="wants" data-filter="active"><span class="metric-icon">✦</span><span class="metric-label">Active Wants</span><strong id="activeWants">—</strong><small>方向を決めたテーマ</small></button>
          <button class="metric metric-gap" type="button" data-view="wants" data-filter="no-action"><span class="metric-icon">○</span><span class="metric-label">次の一歩が未設定</span><strong id="wantsWithoutAction">—</strong><small>具体化を待っています</small></button>
          <button class="metric metric-action" type="button" data-view="actions" data-filter="open"><span class="metric-icon">→</span><span class="metric-label">Open Actions</span><strong id="openActions">—</strong><small>実行できる次の行動</small></button>
        </section>

        <section class="workspace">
          <div class="workspace-head">
            <div><p class="section-kicker">YOUR MAP</p><h2 id="listTitle">Inbox</h2></div>
            <div class="workspace-tools">
              <button class="primary-action" id="addInboxButton" type="button"><span aria-hidden="true">＋</span> Inboxを追加</button>
              <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span class="sr-only">検索</span><input id="searchInput" type="search" placeholder="キーワードで検索" autocomplete="off" /></label>
              <select id="statusFilter" aria-label="ステータスで絞り込み"><option value="">すべてのステータス</option></select>
            </div>
          </div>
          <div class="tabs" role="tablist" aria-label="表示するデータ">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-view="inbox">Inbox <span id="inboxTabCount">—</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-view="wants">Wants <span id="wantsTabCount">—</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-view="actions">Next Actions <span id="actionsTabCount">—</span></button>
          </div>
          <div class="list-meta"><p id="resultCount">データを読み込んでいます</p><button id="clearFilter" class="text-button" type="button" hidden>絞り込みを解除</button></div>
          <div class="card-list" id="cardList" aria-live="polite"><div class="loading"><span></span><p>Supabaseから読み込んでいます</p></div></div>
        </section>
      </main>
      <footer><span>Compass v0.8</span><span>Supabaseと同期</span></footer>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle"><button class="drawer-close" id="drawerClose" type="button" aria-label="詳細を閉じる">×</button><p class="drawer-kicker" id="drawerKicker"></p><h2 id="drawerTitle"></h2><div id="drawerBody"></div></aside>

    <div class="form-backdrop" id="inboxModal" hidden>
      <section class="form-modal" role="dialog" aria-modal="true" aria-labelledby="inboxModalTitle">
        <div class="form-modal-head">
          <div><p class="section-kicker">QUICK CAPTURE</p><h2 id="inboxModalTitle">Inboxを追加</h2></div>
          <button class="modal-close" id="inboxModalClose" type="button" aria-label="閉じる">×</button>
        </div>
        <form id="inboxForm">
          <label class="form-field">
            <span>内容 <b>必須</b></span>
            <textarea id="inboxContent" maxlength="2000" rows="7" placeholder="気になったこと、思いついたことをそのまま入力" required></textarea>
            <small><span id="inboxCharacterCount">0</span> / 2000</small>
          </label>
          <p class="form-error" id="inboxFormError" role="alert" hidden></p>
          <div class="form-actions">
            <button class="secondary-action" id="inboxCancelButton" type="button">キャンセル</button>
            <button class="primary-action" id="inboxSubmitButton" type="submit">Inboxに保存</button>
          </div>
        </form>
      </section>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
