<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Idea — Inbox, Wants & ToDo</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/dashboard-shell.css" />
  </head>
  <body>
    <div class="shell">
      <header class="dashboard-header">
        <div class="dashboard-header-inner">
          <div class="dashboard-brand">
            <span class="dashboard-brand-mark idea" aria-hidden="true">
              <svg class="idea-mark-icon" viewBox="0 0 24 24">
                <path d="M9 18h6M10 21h4" />
                <path d="M8.5 14.5a6 6 0 1 1 7 0c-.9.7-1.5 1.6-1.5 2.5h-4c0-.9-.6-1.8-1.5-2.5Z" />
              </svg>
            </span>
            <span><h1>Idea</h1><small>Inbox, Wants & ToDo</small></span>
          </div>
          <div class="dashboard-actions">
            <a class="dashboard-hub" href="/">← Hub</a>
            <details class="dashboard-switcher" id="dashboardSwitcher">
              <summary aria-label="ページを切り替える">
                <svg class="dashboard-switcher-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="5" cy="6" r="1" /><circle cx="5" cy="12" r="1" /><circle cx="5" cy="18" r="1" />
                  <path d="M9 6h10M9 12h10M9 18h10" />
                </svg>
                <span>Dashboards</span>
              </summary>
              <nav id="dashboardNav" aria-label="ダッシュボードを切り替え"><span class="nav-loading">リンクを確認中</span></nav>
            </details>
            <span class="source-badge" id="sourceBadge"><i></i>接続確認中</span>
            <button class="dashboard-refresh" id="refreshButton" type="button" title="再読み込み" aria-label="データを再読み込み">↻</button>
            <button class="dashboard-primary" id="addInboxButton" type="button"><span aria-hidden="true">＋</span><span>Inboxを追加</span></button>
          </div>
        </div>
      </header>

      <main class="dashboard-main">
        <div class="page-utility-toolbar">
          <a class="dashboard-secondary" href="/api/google-calendar-connect" title="Google Calendarを接続または再接続">Calendar再接続</a>
        </div>
        <section class="metrics" aria-label="サマリー">
          <button class="metric metric-inbox" type="button" data-view="inbox" data-filter="pending"><span class="metric-icon">↘</span><span class="metric-label">未整理のInbox</span><strong id="pendingInbox">—</strong><small><span id="inboxTotal">—</span>件のうち</small></button>
          <button class="metric metric-wants" type="button" data-view="wants" data-filter="active"><span class="metric-icon">✦</span><span class="metric-label">未整理のWants</span><strong id="activeWants">—</strong><small>次の扱いを決める</small></button>
          <button class="metric metric-todos" type="button" data-view="todos" data-filter="pending"><span class="metric-icon">✓</span><span class="metric-label">未実施のToDo</span><strong id="pendingTodos">—</strong><small>Calendar化した予定</small></button>
          <button class="metric metric-triage" type="button" data-view="wants" data-filter="completed"><span class="metric-icon">◇</span><span class="metric-label">整理済みのWants</span><strong id="completedWants">—</strong><small>振り分け履歴を確認</small></button>
        </section>

        <section class="workspace">
          <div class="workspace-head">
            <div><p class="section-kicker">YOUR MAP</p><h2 id="listTitle">Inbox</h2></div>
            <div class="workspace-tools">
              <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span class="sr-only">検索</span><input id="searchInput" type="search" placeholder="キーワードで検索" autocomplete="off" /></label>
              <select id="statusFilter" aria-label="ステータスで絞り込み"><option value="">すべてのステータス</option></select><button class="filter-chip" id="knowledgeFilter" type="button" aria-pressed="false">Knowledge登録待ち <b id="knowledgePendingCount">—</b></button>
              <div class="todo-filter-group" id="todoFilterGroup" hidden aria-label="ToDoの予定で絞り込み">
                <button class="filter-chip" type="button" data-todo-filter="overdue">実施確認待ち</button>
                <button class="filter-chip" type="button" data-todo-filter="today">今日</button>
                <button class="filter-chip" type="button" data-todo-filter="upcoming">今後</button>
              </div>
            </div>
          </div>
          <div class="tabs" role="tablist" aria-label="表示するデータ">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-view="inbox">Inbox <span id="inboxTabCount">—</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-view="wants">Wants <span id="wantsTabCount">—</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-view="todos">ToDo <span id="todosTabCount">—</span></button>
          </div>
          <div class="list-meta"><p id="resultCount">データを読み込んでいます</p><button id="clearFilter" class="text-button" type="button" hidden>絞り込みを解除</button></div>
          <div class="card-list" id="cardList" aria-live="polite"><div class="loading"><span></span><p>Supabaseから読み込んでいます</p></div></div>
        </section>
      </main>
      <footer><span>Idea v1.2</span><span>Supabase・Google Calendarと同期</span></footer>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle"><button class="drawer-close" id="drawerClose" type="button" aria-label="詳細を閉じる">×</button><p class="drawer-kicker" id="drawerKicker"></p><h2 id="drawerTitle"></h2><div id="drawerBody"></div></aside>

    <div class="form-backdrop" id="inboxModal" hidden>
      <section class="form-modal" role="dialog" aria-modal="true" aria-labelledby="inboxModalTitle">
        <div class="form-modal-head">
          <div><p class="section-kicker">QUICK CAPTURE</p><h2 id="inboxModalTitle">Inboxを追加</h2></div>
          <button class="modal-close" id="inboxModalClose" type="button" aria-label="閉じる">×</button>
        </div>
        <form id="inboxForm">
          <label class="form-field">
            <span>内容 <b>必須</b></span>
            <textarea id="inboxContent" maxlength="2000" rows="7" placeholder="気になったこと、思いついたことをそのまま入力" required></textarea>
            <small><span id="inboxCharacterCount">0</span> / 2000</small>
          </label>
          <p class="form-error" id="inboxFormError" role="alert" hidden></p>
          <div class="form-actions">
            <button class="secondary-action" id="inboxCancelButton" type="button">キャンセル</button>
            <button class="primary-action" id="inboxSubmitButton" type="submit">Inboxに保存</button>
          </div>
        </form>
      </section>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
