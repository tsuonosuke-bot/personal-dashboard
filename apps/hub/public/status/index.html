<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2ed" />
    <title>接続状態 — Personal Hub</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/dashboard-shell.css" />
    <link rel="stylesheet" href="/dashboard-shell.dark.css" />
    <link rel="stylesheet" href="/status.css" />
    <link rel="stylesheet" href="/status.dark.css" />
  </head>
  <body>
    <header class="dashboard-header">
      <div class="dashboard-header-inner">
        <div class="dashboard-brand">
          <span class="dashboard-brand-mark status" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4" /></svg></span>
          <span><h1>接続状態</h1><small>Personal・Knowledge・Finance</small></span>
        </div>
        <div class="dashboard-actions">
          <a class="dashboard-hub" href="/">← Hub</a>
          <details class="dashboard-switcher">
            <summary aria-label="ページを切り替える">
              <svg class="dashboard-switcher-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="5" cy="6" r="1" /><circle cx="5" cy="12" r="1" /><circle cx="5" cy="18" r="1" />
                <path d="M9 6h10M9 12h10M9 18h10" />
              </svg>
              <span>Dashboards</span>
            </summary>
            <div class="dashboard-switcher-menu">
              <nav aria-label="ダッシュボードを切り替え">
                <a href="/compass/">Idea</a><a href="/projects/">Projects</a><a href="/writing/">Writing</a><a href="/habits/">Habits</a><a href="/go/financial">Finance</a><a href="/go/knowledge">Knowledge</a><span aria-current="page">接続状態</span>
              </nav>
              <label class="theme-select"><span>表示</span><select data-theme-select aria-label="表示テーマ"><option value="system">自動</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label>
            </div>
          </details>
          <button class="dashboard-refresh" id="refreshButton" type="button" title="再確認" aria-label="接続状態を再確認">↻</button>
        </div>
      </div>
    </header>
    <main class="dashboard-main">
      <div class="status-loading" id="loadingState" role="status"><span></span><p>3つの接続先を確認しています</p></div>
      <div class="status-error" id="errorState" role="alert" hidden><strong>接続状態を読み込めませんでした</strong><p id="errorMessage"></p><button id="retryButton" type="button">再試行</button></div>
      <section class="status-grid" id="statusGrid" aria-label="サービス別の接続状態" hidden></section>
    </main>
    <script src="/status/status.js" type="module"></script>
    <script src="/tabbar.js" data-page="status" defer></script>
  </body>
</html>
