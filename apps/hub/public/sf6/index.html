<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>SF6 — Personal Dashboard</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/sf6.css" />
    <link rel="stylesheet" href="/sf6.dark.css" />
    <link rel="stylesheet" href="/dashboard-shell.css" />
    <link rel="stylesheet" href="/dashboard-shell.dark.css" />
  </head>
  <body>
    <div class="shell">
      <header class="dashboard-header">
        <div class="dashboard-header-inner">
          <div class="dashboard-brand">
            <span class="dashboard-brand-mark sf6" aria-hidden="true">SF</span>
            <span><h1>SF6</h1><small>コンボ・起き攻め・練習</small></span>
          </div>
          <div class="dashboard-actions">
            <a class="dashboard-hub" href="/">← Hub</a>
            <details class="dashboard-switcher">
              <summary aria-label="ページを切り替える">
                <svg class="dashboard-switcher-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="5" cy="6" r="1" /><circle cx="5" cy="12" r="1" /><circle cx="5" cy="18" r="1" />
                  <path d="M9 6h10M9 12h10M9 18h10" />
                </svg>
                <span>Dashboards</span>
              </summary>
              <div class="dashboard-switcher-menu">
                <nav aria-label="ダッシュボードを切り替え">
                  <a href="/compass/">Idea</a><a href="/projects/">Projects</a><a href="/writing/">Writing</a><a href="/habits/">Habits</a><span aria-current="page">SF6</span><a href="/go/financial">Finance</a><a href="/go/knowledge">Knowledge</a><a href="/status/">接続状態</a>
                </nav>
                <label class="theme-select"><span>表示</span><select data-theme-select aria-label="表示テーマ"><option value="system">自動</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label>
              </div>
            </details>
            <span class="source-badge" id="sourceBadge"><i></i><span>接続確認中</span></span>
            <button class="dashboard-refresh" id="refreshButton" type="button" aria-label="データを再読み込み" title="再読み込み">↻</button><a class="dashboard-refresh dashboard-help" href="/help/#sf6" title="ヘルプ" aria-label="ヘルプ">?</a>
            <button class="dashboard-primary" id="addButton" type="button"><span aria-hidden="true">＋</span><span id="addLabel">手順を追加</span></button>
          </div>
        </div>
      </header>

      <main class="dashboard-main">
        <nav class="tabs" role="tablist" aria-label="SF6の記録">
          <button type="button" role="tab" data-tab="sequences" aria-selected="true">手順<b id="countSequences"></b></button>
          <button type="button" role="tab" data-tab="situations" aria-selected="false">状況<b id="countSituations"></b></button>
          <button type="button" role="tab" data-tab="frames" aria-selected="false">フレーム</button>
          <button type="button" role="tab" data-tab="drills" aria-selected="false">練習<b id="countDrills"></b></button>
          <button type="button" role="tab" data-tab="matches" aria-selected="false">振り返り<b id="countMatches"></b></button>
        </nav>

        <div class="state-card" id="loadingState" role="status"><span class="spinner"></span><p>読み込んでいます</p></div>
        <div class="state-card error-state" id="errorState" role="alert" hidden><h2>読み込めませんでした</h2><p id="errorMessage"></p><button id="retryButton" type="button">再試行</button></div>

        <section class="tab-panel" id="panel-sequences" role="tabpanel" hidden>
          <div class="filters">
            <select id="sequenceCharacter" aria-label="キャラで絞り込む"></select>
            <div class="segmented" role="group" aria-label="種類で絞り込む" id="sequenceKind">
              <button type="button" data-value="" aria-pressed="true">すべて</button>
              <button type="button" data-value="combo" aria-pressed="false">コンボ</button>
              <button type="button" data-value="setplay" aria-pressed="false">起き攻め</button>
            </div>
            <div class="segmented" role="group" aria-label="位置で絞り込む" id="sequencePosition">
              <button type="button" data-value="" aria-pressed="true">すべて</button>
              <button type="button" data-value="midscreen" aria-pressed="false">中央</button>
              <button type="button" data-value="corner" aria-pressed="false">画面端</button>
            </div>
            <select id="sequenceSituation" aria-label="状況から引く"></select>
            <details class="menu">
              <summary aria-label="状況のメニュー" title="状況のメニュー">⋯</summary>
              <div class="menu-list">
                <button type="button" data-open-route>ルートで見る</button>
                <button type="button" data-open-flow>フローチャートで見る</button>
                <button type="button" data-manage-situations>状況を管理</button>
              </div>
            </details>
            <details class="conditions" id="sequenceConditions">
              <summary>条件：<span id="conditionSummary">指定なし</span></summary>
              <div class="condition-grid">
                <label><span>相手キャラ</span><select id="opponentCharacter"></select></label>
                <label class="opponent-move-field"><span>相手の技（ガード後）</span><select id="opponentMove" disabled><option value="">相手の技を選ぶ</option></select></label>
                <div class="opponent-move-status"><span id="opponentMoveStatus" role="status"></span><button id="opponentMoveRetry" type="button" class="ghost-button" hidden>再試行</button></div>
                <label><span>残りDゲージ</span><select id="conditionDrive"></select></label>
                <label><span>SAゲージ</span><select id="conditionSa"></select></label>
                <label><span>相手の不利F</span><input id="conditionPunish" type="number" inputmode="numeric" min="1" max="99" step="1" placeholder="例：5" /></label>
                <label class="check-field"><input type="checkbox" id="conditionCa" /><span>CA可（体力25%以下）</span></label>
                <label class="check-field"><input type="checkbox" id="conditionBurnout" /><span>自分がバーンアウト中</span></label>
              </div>
            </details>
          </div>
          <div class="card-list" id="sequenceList"></div>
          <details class="fold" id="sequenceArchiveFold"><summary>アーカイブ <span id="sequenceArchiveCount"></span></summary><div class="card-list" id="sequenceArchive"></div></details>
        </section>

        <section class="tab-panel" id="panel-situations" role="tabpanel" hidden>
          <div class="filters">
            <select id="situationCharacter" aria-label="キャラを選ぶ"></select>
            <div class="segmented" role="group" aria-label="位置で絞り込む" id="situationPosition">
              <button type="button" data-value="" aria-pressed="true">すべて</button>
              <button type="button" data-value="midscreen" aria-pressed="false">中央</button>
              <button type="button" data-value="corner" aria-pressed="false">画面端</button>
            </div>
            <button type="button" class="toggle-chip" id="situationNear" aria-pressed="true" title="有利Fが1〜2Fずれる手順（黄色）の表示を切り替えます">近い手順（黄）</button>
          </div>
          <div class="card-list" id="situationList"></div>
          <details class="fold" id="situationArchiveFold"><summary>アーカイブ <span id="situationArchiveCount"></span></summary><div class="card-list" id="situationArchive"></div></details>
        </section>

        <section class="tab-panel" id="panel-frames" role="tabpanel" hidden>
          <div class="filters">
            <select id="frameCharacter" aria-label="キャラを選ぶ"></select>
            <input id="frameQuery" class="frame-query" type="search" placeholder="技名・コマンドで検索" aria-label="技名・コマンドで検索" autocomplete="off" />
          </div>
          <div class="chip-scroll" id="frameCategory" role="group" aria-label="種類で絞り込む">
            <button type="button" class="toggle-chip" data-category="" aria-pressed="true">すべて</button>
            <button type="button" class="toggle-chip" data-category="normal" aria-pressed="false">通常</button>
            <button type="button" class="toggle-chip" data-category="unique" aria-pressed="false">特殊</button>
            <button type="button" class="toggle-chip" data-category="special" aria-pressed="false">必殺</button>
            <button type="button" class="toggle-chip" data-category="super" aria-pressed="false">SA</button>
            <button type="button" class="toggle-chip" data-category="throw" aria-pressed="false">投げ</button>
            <button type="button" class="toggle-chip" data-category="common" aria-pressed="false">共通</button>
          </div>
          <div class="filters frame-options">
            <select id="frameSort" aria-label="並べ替え">
              <option value="official">公式順</option>
              <option value="startup">発生の速い順</option>
              <option value="block">ガード有利の大きい順</option>
              <option value="blockDisadvantage">ガード不利の大きい順</option>
            </select>
            <button type="button" class="toggle-chip" id="framePunishable" aria-pressed="false">-4F以下</button>
            <button type="button" class="toggle-chip" id="frameHeavyPunishable" aria-pressed="false">-6F以下</button>
            <button type="button" class="toggle-chip" id="frameCancelable" aria-pressed="false">キャンセル可</button>
          </div>
          <p class="frame-version" id="frameVersion"></p>
          <div id="frameTable"></div>
        </section>

        <section class="tab-panel" id="panel-drills" role="tabpanel" hidden>
          <div class="card-list" id="drillList"></div>
          <h2 class="list-title">最近の練習記録</h2>
          <div class="log-list" id="logList"></div>
          <details class="fold" id="drillDoneFold"><summary>完了したメニュー <span id="drillDoneCount"></span></summary><div class="card-list" id="drillDone"></div></details>
        </section>

        <section class="tab-panel" id="panel-matches" role="tabpanel" hidden>
          <div class="stats" id="matchStats"></div>
          <div class="card-list" id="matchList"></div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="editModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head"><h2 id="modalTitle">追加</h2><button id="modalClose" type="button" aria-label="閉じる">×</button></div>
        <form id="editForm" novalidate>
          <div id="formFields"></div>
          <p class="form-error" id="formError" role="alert" hidden></p>
          <div class="delete-confirm" id="deleteConfirm" role="alert" hidden></div>
          <div class="form-actions">
            <button class="danger-button" id="deleteButton" type="button" hidden>削除</button>
            <button class="secondary-button" id="cancelButton" type="button">キャンセル</button>
            <button class="primary-button" id="saveButton" type="submit">保存する</button>
          </div>
        </form>
      </section>
    </div>
    <div class="sheet-backdrop" id="sheet" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="modal-head"><h2 id="sheetTitle"></h2><button id="sheetClose" type="button" aria-label="閉じる">×</button></div>
        <div id="sheetBody"></div>
      </section>
    </div>
    <datalist id="characterOptions"></datalist>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/sf6.js" type="module"></script>
    <script src="/tabbar.js" data-page="sf6" defer></script>
  </body>
</html>
