# Temporary ops branch only. Never merge this workflow replacement into main.
name: Hub dated answers migration
on:
  workflow_dispatch:
    inputs:
      approved_ops_sha:
        description: Exact independently reviewed ops commit SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: supabase-backup
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Execute immutable single-RPC release bundle
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .release/hub-answers-20261027/runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-answers-result-${{ github.run_id }}
          path: hub-answers-result/
          retention-days: 14
          if-no-files-found: warn
