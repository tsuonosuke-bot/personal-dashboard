# Temporary replacement on the reviewed ops branch ONLY. Do not change main's backup workflow.
name: Projects goals database release
on:
  workflow_dispatch:
    inputs:
      approved_ops_sha:
        description: Exact independently reviewed operations commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: projects-goals-production-database
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/projects-goals-ops-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_ops_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Run reviewed release phase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node .release/projects-goals-20261027/ci-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-goals-result-${{ inputs.approved_ops_sha }}
          path: |
            result-output/release-result.json
            result-output/before-snapshot.json
            result-output/after-snapshot.json
            result-output/generated-database.types.ts
          if-no-files-found: ignore
          retention-days: 14
